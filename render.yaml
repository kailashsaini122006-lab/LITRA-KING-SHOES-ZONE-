# Render.com deployment configuration for Litra King Backend
# This file enables automatic deployment on Render
services:
  - type: web
    name: litra-king-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false          # Set this manually in Render dashboard (secret)
      - key: FRONTEND_URL
        value: https://litra-king-shoes-zonechomu.vercel.app
    healthCheckPath: /
